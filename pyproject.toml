[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litemedrag"
version = "1.0.0"
description = "LiteMedRAG reference implementation for MIWAI 2026 paper 157"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "torch>=2.1",
  "torchvision>=0.16",
  "open_clip_torch==2.23.0",
  "transformers==4.35.2",
  "datasets>=2.16",
  "Pillow>=10.0",
  "matplotlib>=3.7"
]

[project.scripts]
litemedrag = "litemedrag.pipeline:cli"

[tool.setuptools.packages.find]
where = ["src"]
