[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="compact-medvqa-rag"
version="0.1.0"
description="Compact retrieval-augmented medical VQA codebase derived from the v5 working notebook"
readme="README.md"
requires-python=">=3.10"

[tool.setuptools]
package-dir={""="src"}

[tool.setuptools.packages.find]
where=["src"]
